name: Release

on:
  # Publication is initiated by the owner, independently of merging a PR.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sinapsi-npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'jonatassales/sinapsi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Inspect environment
        run: ./cli/graph doctor --ci
      - name: Identify stable release
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs'
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (name !== 'sinapsi') {
            throw new Error('Expected the canonical Sinapsi package')
          }
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error('Expected canonical SemVer')
          }
          if (version.startsWith('0.')) {
            console.log('Skipping publish for a 0.x version')
            appendFileSync(process.env.GITHUB_ENV, 'SKIP_PUBLISH=1\n')
          }
          appendFileSync(
            process.env.GITHUB_ENV,
            `RELEASE_VERSION=${version}\nRELEASE_TAG=v${version}\n`
          )
          NODE
      - name: Validate and pack once
        if: env.SKIP_PUBLISH != '1'
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Publish validated tarball
        if: env.SKIP_PUBLISH != '1'
        run: npm publish "$RUNNER_TEMP"/sinapsi-$RELEASE_VERSION.tgz --access public --tag latest --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
