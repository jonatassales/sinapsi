name: Release

on:
  # Publication is initiated by the owner, independently of merging a PR.
  workflow_dispatch:

permissions:
  contents: read

env:
  npm_config_ignore_scripts: 'true'

concurrency:
  group: sinapsi-npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'jonatassales/sinapsi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Identify stable release
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs'
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (name !== 'sinapsi') {
            throw new Error('Expected the canonical Sinapsi package')
          }
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error('Expected canonical SemVer')
          }
          appendFileSync(
            process.env.GITHUB_ENV,
            `RELEASE_VERSION=${version}\nRELEASE_TAG=v${version}\n`
          )
          NODE
      - name: Validate package source and distribution
        run: |
          pnpm exec biome lint src sandbox test cli package.json biome.json tsconfig.json tsconfig.test.json *.config.ts commitlint.config.cjs
          pnpm exec tsc --noEmit
          pnpm exec tsc -p tsconfig.test.json --noEmit
          pnpm exec vitest run
          pnpm exec tsdown
          pnpm exec tsdown --config tsdown.standalone.config.ts
      - name: Pack validated build once
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Publish validated tarball
        run: npm publish "$RUNNER_TEMP"/sinapsi-$RELEASE_VERSION.tgz --access public --tag latest --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
