name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  npm_config_ignore_scripts: 'true'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null
          commits=$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          for commit in $commits; do
            git show -s --format=%B "$commit" | pnpm exec commitlint --verbose
          done

      - name: Lint pushed commit
        if: github.event_name == 'push'
        run: |
          if git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
            commits=$(git rev-list --no-merges 'HEAD^1..HEAD')
          else
            commits=$(git rev-parse --verify HEAD)
          fi
          for commit in $commits; do
            git show -s --format=%B "$commit" | pnpm exec commitlint --verbose
          done

      - name: Lint
        run: ./cli/graph lint

      - name: Typecheck
        run: ./cli/graph typecheck

      - name: Test
        run: ./cli/graph test

      - name: Build
        run: ./cli/graph build

      - name: Validate package version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import semver from 'semver'
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (typeof version !== 'string' || semver.valid(version) !== version) {
            throw new Error('package.json version must use canonical SemVer')
          }
          console.log(`package.json uses canonical SemVer ${version}`)
          NODE

      # Repository audits and agent scaffolds are being restructured separately.
      # Package gates above run explicitly; prepack would repeat scaffold checks.
      - name: Verify npm payload
        run: npm pack --dry-run --ignore-scripts
